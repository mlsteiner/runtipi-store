services:
    profilarr:
        image: ghcr.io/dictionarry-hub/profilarr:2.0.9
        volumes:
            - ${APP_DATA_DIR}/data/config:/config
        environment:
            - PUID=1000
            - PGIUD=1000
            - TZ=${TZ}
        x-runtipi:
          is_main: true
          internal_port: 6868
    
x-runtipi:
    schema_version: 2