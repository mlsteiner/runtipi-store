services:
  sportarr:
    image: sportarr/sportarr:latest
    container_name: sportarr
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=${TZ}  # Optional: set your timezone
    volumes:
      - ${APP_DATA_DIR}/config:/config
      - /mnt/BX500/media:/data
    ports:
      - 1867:1867
    restart: unless-stopped
    x-runtipi:
          is_main: true
          internal_port: 1867
    
x-runtipi:
    schema_version: 2