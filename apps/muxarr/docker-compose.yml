services:
  muxarr:
    image: ghcr.io/kirovair/muxarr:v0.9.2
    container_name: muxarr
    environment:
      - TZ=${TZ}
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /mnt/BX500/media:/media
    ports:
      - 8183:8183
    restart: unless-stopped
        x-runtipi:
          is_main: true
          internal_port: 8183
    
x-runtipi:
    schema_version: 2